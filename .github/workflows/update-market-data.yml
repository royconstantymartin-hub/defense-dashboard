name: Update Market Data

on:
  schedule:
    # Runs Monday–Friday at 07:30 UTC (after European market open, before US open)
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    # Allows manual trigger from the GitHub Actions UI

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch market data
        run: python scripts/fetch_market_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-data.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "data: update market data ${DATE}"
            git push origin main
          fi
